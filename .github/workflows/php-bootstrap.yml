name: PHP Bootstrap

on:
  pull_request:
    paths:
      - '.github/workflows/php-bootstrap.yml'
      - 'wp-content/plugins/manga-overlay-core/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/php-bootstrap.yml'
      - 'wp-content/plugins/manga-overlay-core/**'

permissions:
  contents: read

jobs:
  plugin-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up PHP 8.4 and Composer
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer --working-dir=wp-content/plugins/manga-overlay-core validate --strict

      - name: Install plugin autoloader
        run: composer --working-dir=wp-content/plugins/manga-overlay-core install --no-interaction --no-progress --prefer-dist

      - name: Lint and smoke-test bootstrap
        run: composer --working-dir=wp-content/plugins/manga-overlay-core run check

      - name: Verify production autoloader
        run: |
          composer --working-dir=wp-content/plugins/manga-overlay-core dump-autoload --no-dev --classmap-authoritative
          php -r "require 'wp-content/plugins/manga-overlay-core/vendor/autoload.php'; exit(class_exists('MOL\\Plugin') ? 0 : 1);"

      - name: Package installable plugin
        run: |
          test -s wp-content/plugins/manga-overlay-core/assets/dist/editor.js
          test -s wp-content/plugins/manga-overlay-core/assets/dist/editor.css
          grep -F 'Version:           0.10.1' wp-content/plugins/manga-overlay-core/manga-overlay-core.php
          mkdir -p build/manga-overlay-core
          rsync -a --exclude='tests/' wp-content/plugins/manga-overlay-core/ build/manga-overlay-core/
          (cd build && zip -qr manga-overlay-core.zip manga-overlay-core)
          unzip -l build/manga-overlay-core.zip | grep -F 'manga-overlay-core/vendor/autoload.php'

      - name: Upload installable plugin
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manga-overlay-core-candidate
          path: build/manga-overlay-core.zip
          if-no-files-found: error
          retention-days: 14
