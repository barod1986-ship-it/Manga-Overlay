name: Verify initial implementation
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: verify-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  renderer-and-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci
      - run: npm run check
      - name: Verify generated types are current
        run: |
          npm run generate:types
          git diff --exit-code -- wp-content/plugins/manga-overlay-core/editor-src/generated/api.d.ts
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: mol-frontend
          path: wp-content/plugins/manga-overlay-core/assets/dist/
  wordpress-foundation:
    needs: [renderer-and-contract]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        database: ['mysql:8.4', 'mariadb:10.11']
    services:
      database:
        image: ${{ matrix.database }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: mol_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent || mariadb-admin ping -h 127.0.0.1 --silent"
          --health-interval 10s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mysqli, mbstring, gd
          tools: composer:v2, wp-cli
          coverage: none
      - name: Build the plugin autoloader and lint PHP
        run: |
          composer validate --working-dir=wp-content/plugins/manga-overlay-core --no-check-publish
          composer dump-autoload --working-dir=wp-content/plugins/manga-overlay-core --classmap-authoritative
          find wp-content/plugins/manga-overlay-core/src wp-content/plugins/manga-overlay-core/templates wp-content/themes/manga-overlay-theme tests/wordpress -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l wp-content/plugins/manga-overlay-core/manga-overlay-core.php
      - name: Install a disposable WordPress 7.1 application
        env:
          MOL_WP_ROOT: ${{ runner.temp }}/mol-wordpress
        run: |
          mkdir -p "$MOL_WP_ROOT"
          wp core download --version=7.1 --path="$MOL_WP_ROOT"
          wp config create --path="$MOL_WP_ROOT" --dbname=mol_test --dbuser=root --dbpass='' --dbhost=127.0.0.1 --dbprefix=qa_
          wp config set WP_ENVIRONMENT_TYPE local --path="$MOL_WP_ROOT"
          wp core install --path="$MOL_WP_ROOT" --url=http://localhost:8080 --title='MOL CI' --admin_user=mol_ci --admin_password="$(openssl rand -hex 24)" --admin_email=mol-ci@example.invalid --skip-email
          ln -s "$GITHUB_WORKSPACE/wp-content/plugins/manga-overlay-core" "$MOL_WP_ROOT/wp-content/plugins/manga-overlay-core"
          wp plugin activate manga-overlay-core --path="$MOL_WP_ROOT"
          ln -s "$GITHUB_WORKSPACE/wp-content/themes/manga-overlay-theme" "$MOL_WP_ROOT/wp-content/themes/manga-overlay-theme"
          wp theme activate manga-overlay-theme --path="$MOL_WP_ROOT"
          wp rewrite structure '/%postname%/' --path="$MOL_WP_ROOT"
          mkdir -p "$MOL_WP_ROOT/wp-content/mu-plugins"
          cp "$GITHUB_WORKSPACE/tests/wordpress/hold-deletion.php" "$MOL_WP_ROOT/wp-content/mu-plugins/hold-deletion.php"
      - uses: actions/download-artifact@v4
        with:
          name: mol-frontend
          path: wp-content/plugins/manga-overlay-core/assets/dist/
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run actual dbDelta, role, CPT and transaction tests
        env:
          MOL_WP_ROOT: ${{ runner.temp }}/mol-wordpress
          MOL_TEST_ENV: '1'
        run: wp eval-file "$GITHUB_WORKSPACE/tests/wordpress/integration.php" --use-include --path="$MOL_WP_ROOT"
      - name: Run content services, REST permissions and media integration tests
        env:
          MOL_WP_ROOT: ${{ runner.temp }}/mol-wordpress
          MOL_TEST_ENV: '1'
          MOL_HTTP_FIXTURE: ${{ runner.temp }}/mol-http-fixture.json
          MOL_CONTENT_RESPONSES: ${{ runner.temp }}/mol-content-responses.json
          MOL_ELEMENT_VECTORS: ${{ runner.temp }}/mol-element-vectors.json
        run: |
          wp plugin activate manga-overlay-core --path="$MOL_WP_ROOT"
          python -m pip install -r requirements-dev.txt
          python scripts/element-validation-vectors.py "$RUNNER_TEMP/mol-element-vectors.json"
          wp eval-file "$GITHUB_WORKSPACE/tests/wordpress/content.php" --use-include --path="$MOL_WP_ROOT"
          PHP_CLI_SERVER_WORKERS=4 wp server --host=127.0.0.1 --port=8080 --path="$MOL_WP_ROOT" > "$RUNNER_TEMP/mol-http-server.log" 2>&1 &
          python tests/wordpress/http_content.py
          python -m pip install -r requirements-dev.txt
          python scripts/check-content-responses.py "$MOL_CONTENT_RESPONSES"
          npx playwright test --config playwright.wordpress.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wordpress-browser-${{ strategy.job-index }}
          path: test-results/
          retention-days: 14
  development-package:
    needs: [renderer-and-contract, wordpress-foundation]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      database:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: mol_package_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 10s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mysqli, mbstring
          tools: composer:v2, wp-cli
          coverage: none
      - uses: actions/download-artifact@v4
        with:
          name: mol-frontend
          path: wp-content/plugins/manga-overlay-core/assets/dist/
      - name: Build the development ZIP
        run: |
          composer dump-autoload --working-dir=wp-content/plugins/manga-overlay-core --classmap-authoritative
          python scripts/package-development.py
      - name: Verify installation from the actual ZIP
        env:
          MOL_WP_ROOT: ${{ runner.temp }}/mol-package-wordpress
        run: |
          mkdir -p "$MOL_WP_ROOT"
          wp core download --version=7.1 --path="$MOL_WP_ROOT"
          wp config create --path="$MOL_WP_ROOT" --dbname=mol_package_test --dbuser=root --dbpass='' --dbhost=127.0.0.1 --dbprefix=package_
          wp core install --path="$MOL_WP_ROOT" --url=http://localhost:8080 --title='MOL package CI' --admin_user=mol_package_ci --admin_password="$(openssl rand -hex 24)" --admin_email=mol-package-ci@example.invalid --skip-email
          wp plugin install "$GITHUB_WORKSPACE/build/manga-overlay-core-development.zip" --activate --path="$MOL_WP_ROOT"
          wp theme install "$GITHUB_WORKSPACE/build/manga-overlay-theme-development.zip" --activate --path="$MOL_WP_ROOT"
          wp eval 'if (get_option("mol_db_version") !== "1.1.3" || !post_type_exists("mol_work") || get_stylesheet() !== "manga-overlay-theme" || !is_file(WP_PLUGIN_DIR . "/manga-overlay-core/assets/dist/reader/reader.js") || !is_file(WP_PLUGIN_DIR . "/manga-overlay-core/assets/dist/editor/editor.js") || !is_file(WP_PLUGIN_DIR . "/manga-overlay-core/templates/editor.php")) { WP_CLI::error("Packaged plugin did not initialize."); } WP_CLI::success("Packaged plugin activated and initialized.");' --path="$MOL_WP_ROOT"
      - uses: actions/upload-artifact@v4
        with:
          name: manga-overlay-development-package
          path: build/
          retention-days: 30
