name: Frontend PoC

on:
  pull_request:
    paths:
      - '.github/workflows/frontend-poc.yml'
      - '.nvmrc'
      - 'package.json'
      - 'package-lock.json'
      - 'poc/editor-input/**'
      - 'poc/renderer/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/frontend-poc.yml'
      - '.nvmrc'
      - 'package.json'
      - 'package-lock.json'
      - 'poc/editor-input/**'
      - 'poc/renderer/**'

permissions:
  contents: read

jobs:
  frontend-pocs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check renderer and editor-input PoCs
        run: npm run check

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Verify renderer and editor input in browsers
        run: npm run test:e2e
