name: Frontend PoC

on:
  pull_request:
    paths:
      - '.github/workflows/frontend-poc.yml'
      - '.nvmrc'
      - 'package.json'
      - 'package-lock.json'
      - 'poc/renderer/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/frontend-poc.yml'
      - '.nvmrc'
      - 'package.json'
      - 'package-lock.json'
      - 'poc/renderer/**'

permissions:
  contents: read

jobs:
  renderer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check renderer PoC
        run: npm run check:poc
