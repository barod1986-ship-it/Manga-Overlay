# Manga Overlay strong version ETags (xCloud Nginx >= 1.29.3).
# Install inside the existing PHP location; retain inherited security headers.
set $mol_rest_response 0;
if ($request_uri ~ "^/(index[.]php/)?wp-json/mol/v1(/|[?]|$)") {
    set $mol_rest_response 1;
}
if ($arg_rest_route ~* "^(/|%2f)mol(/|%2f)v1(/|%2f|$)") {
    set $mol_rest_response 1;
}
if ($mol_rest_response = 1) {
    gzip off;
    brotli off;
    add_header_inherit merge;
    add_header Cache-Control "no-transform" always;
}
