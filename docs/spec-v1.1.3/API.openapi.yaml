          shape:
            type: string
            enum:
            - ellipse
            - rounded_rect
            - rect
            - cloud
        not:
          anyOf:
          - required:
            - burst
          - required:
            - scaleX
          - required:
            - scaleY
    NarrationStyle:
      allOf:
      - $ref: '#/components/schemas/ElementStyle'
      - type: object
        properties:
          shape:
            type: string
            enum:
            - rect
            - rounded_rect
        not:
          anyOf:
          - required:
            - tail
          - required:
            - burst
          - required:
            - scaleX
          - required:
            - scaleY
    FreeTextStyle:
      allOf:
      - $ref: '#/components/schemas/ElementStyle'
      - type: object
        properties:
          shape:
            type: string
            enum:
            - none
            - rect
            - rounded_rect
        not:
          anyOf:
          - required:
            - tail
          - required:
            - burst
          - required:
            - scaleX
          - required:
            - scaleY
    SfxStyle:
      allOf:
      - $ref: '#/components/schemas/ElementStyle'
      - type: object
        properties:
          shape:
            type: string
            enum:
            - none
            - burst
            - impact
        not:
          anyOf:
          - required:
            - tail
