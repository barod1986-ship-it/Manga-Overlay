openapi: 3.1.2
info:
  title: Manga Overlay Library API
  version: 1.1.3
servers:
- url: /wp-json/mol/v1
x-wordpress-authentication:
  mode: same-origin-login-cookie-plus-rest-nonce
  description: WordPress authenticates the logged-in same-origin session with its login cookies. X-WP-Nonce (action
    wp_rest) is additionally required by MOL write routes as REST/CSRF protection; the nonce is not standalone authentication.
    WordPress cookie names are installation-dependent, so the dynamic login cookie is documented here instead of
    being modeled as a fixed OpenAPI apiKey cookie name.
paths:
  /library:
    get:
      summary: Search and filter works
      parameters:
      - name: search
        in: query
        required: false
        schema:
          type: string
          maxLength: 200
      - name: type
        in: query
        required: false
        schema:
          type: string
      - name: genre
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: One or more genre slugs; form/explode semantics apply.
      - name: source_lang
        in: query
        required: false
        schema:
          type: string
          maxLength: 255
      - name: work_status
        in: query
        required: false
        schema:
          type: string
      - name: translation_status
        in: query
        required: false
        schema:
          type: string
          enum:
          - untranslated
          - in_progress
          - completed
          - needs_review
        description: Matches works that have at least one published chapter in the requested translation status.
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - latest_chapter
          - latest_work
          - title_asc
          - most_read
          default: latest_chapter
        description: most_read is a conditional capability. The MVP ships without a read-counter backend, so most_read_available
          is false and requesting sort=most_read returns 400 mol_sort_unavailable until that backend is implemented.
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated work list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkListResponse'
        '400':
          $ref: '#/components/responses/LibraryBadRequest'
      operationId: listWorks
  /capabilities:
    get:
      summary: Read installation runtime capabilities
      operationId: getRuntimeCapabilities
      responses:
        '200':
          description: Runtime capabilities used by the client to expose optional features and upload formats.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'
  /works/{id}:
    get:
      summary: Get work
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Work detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkResponse'
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: getWork
  /works/{id}/chapters:
    get:
      summary: List published chapters
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Published chapters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChapterListResponse'
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: listWorkChapters
      description: Lists published chapters only. Draft chapters are intentionally excluded from this collection
        route.
  /chapters/{id}:
    get:
      summary: Get chapter
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Chapter detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChapterResponse'
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: getChapter
      security:
      - wpRestNonce: []
      - {}
      x-resource-visibility: published_public_draft_editor_or_manager_else_404
      description: 'Visibility policy: published chapter resources are public. If the owning chapter is unpublished,
        the same route returns the resource only when the request carries a valid WordPress REST authenticated context
        and the caller has mol_use_editor or mol_manage_content; otherwise it returns 404 to avoid disclosing draft
        existence.'
    patch:
      summary: Update chapter
      security:
      - wpRestNonce: []
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChapterResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/InvalidParams'
      operationId: updateChapter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChapterPatch'
      x-required-capability: mol_manage_content
      description: General content-management update. Moderators without mol_manage_content must use /chapters/{id}/review
        to set review status.
    delete:
      summary: Delete chapter
      security:
      - wpRestNonce: []
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: deleteChapter
      x-required-capability: mol_manage_content
  /chapters:
    post:
      summary: Create chapter
      security:
      - wpRestNonce: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChapterResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/InvalidParams'
        '409':
          $ref: '#/components/responses/SlugConflict'
      operationId: createChapter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChapterCreate'
      x-required-capability: mol_manage_content
  /chapters/{id}/pages:
    get:
      summary: List chapter pages
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Chapter pages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageListResponse'
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: listChapterPages
      security:
      - wpRestNonce: []
      - {}
      x-resource-visibility: published_public_draft_editor_or_manager_else_404
      description: 'Visibility policy: published chapter resources are public. If the owning chapter is unpublished,
        the same route returns the resource only when the request carries a valid WordPress REST authenticated context
        and the caller has mol_use_editor or mol_manage_content; otherwise it returns 404 to avoid disclosing draft
        existence.'
    post:
      summary: Upload one page image
      security:
      - wpRestNonce: []
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/MOLIdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - image
              properties:
                image: {}
              additionalProperties: false
            encoding:
              image:
                contentType: image/jpeg, image/png, image/webp
                x-optional-runtime-content-types:
                - image/avif
      responses:
        '201':
          description: Page created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponse'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '409':
          $ref: '#/components/responses/IdempotencyMismatch'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/InvalidParams'
        '429':
          $ref: '#/components/responses/RateLimited'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
      operationId: uploadChapterPage
      x-required-capability: mol_upload_content
      description: JPEG/PNG/WebP are baseline accepted upload types. AVIF upload is accepted only when /capabilities
        advertises image/avif for the active server image pipeline; otherwise AVIF returns 415.
  /chapters/{id}/pages/reorder:
    patch:
      summary: Reorder pages
      security:
      - wpRestNonce: []
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Reordered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageListResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/InvalidReorder'
      operationId: reorderChapterPages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PageReorder'
      x-required-capability: mol_manage_content
      description: page_ids must be a complete permutation of the current chapter page IDs. The server locks the
        chapter page rows in a transaction, moves all current page_index values into a temporary disjoint range,
        then assigns final 0..N-1 indices, avoiding uq_chapter_index collisions.
  /chapters/{id}/contributors:
    get:
      summary: Chapter contributors
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Chapter contributors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContributorListResponse'
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: listChapterContributors
      security:
      - wpRestNonce: []
      - {}
      x-resource-visibility: published_public_draft_editor_or_manager_else_404
      description: 'Visibility policy: published chapter resources are public. If the owning chapter is unpublished,
        the same route returns the resource only when the request carries a valid WordPress REST authenticated context
        and the caller has mol_use_editor or mol_manage_content; otherwise it returns 404 to avoid disclosing draft
        existence.'
  /pages/{id}/elements:
    get:
      summary: Get page translation elements
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: Translation elements for one page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageElementsResponse'
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: listPageElements
      security:
      - wpRestNonce: []
      - {}
      x-resource-visibility: published_public_draft_editor_or_manager_else_404
      description: 'Visibility policy: published chapter resources are public. If the owning chapter is unpublished,
        the same route returns the resource only when the request carries a valid WordPress REST authenticated context
        and the caller has mol_use_editor or mol_manage_content; otherwise it returns 404 to avoid disclosing draft
        existence. Element collections expose each element version in the JSON body rather than one HTTP ETag per
        child. The editor constructs the required strong If-Match value for an element as the quoted decimal version,
        e.g. version 7 => If-Match: "7".'
  /pages/{id}:
    delete:
      summary: Delete a page
      security:
      - wpRestNonce: []
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: deletePage
      x-required-capability: mol_manage_content
  /elements:
    post:
      summary: Create translation element
      security:
      - wpRestNonce: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ElementCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElementResponse'
          headers:
            ETag:
              description: Strong entity tag equal to the quoted element version, e.g. "7".
              schema:
                type: string
        '409':
          $ref: '#/components/responses/IdempotencyMismatch'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/InvalidParams'
        '429':
          $ref: '#/components/responses/RateLimited'
      parameters:
      - $ref: '#/components/parameters/MOLIdempotencyKeyRequired'
      operationId: createElement
      x-required-capability: mol_edit_translations
      description: Creates an element. If preset_id is supplied, its authorized preset style is used. Otherwise
        the server resolves the default chain personal default → work default → global default → built-in base style
        for the element type. Optional style fields are merged last as overrides. The response returns the fully
        resolved style and ETag version.
  /elements/{id}:
    patch:
      summary: Update translation element
      security:
      - wpRestNonce: []
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/LockToken'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ElementPatch'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElementResponse'
          headers:
            ETag:
              description: Strong entity tag equal to the quoted element version, e.g. "7".
              schema:
                type: string
        '412':
          $ref: '#/components/responses/VersionConflict'
        '423':
          $ref: '#/components/responses/Locked'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/InvalidParams'
        '429':
          $ref: '#/components/responses/RateLimited'
      operationId: updateElement
      x-required-capability: mol_edit_translations
    delete:
      summary: Delete translation element
      security:
      - wpRestNonce: []
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/LockToken'
      responses:
        '204':
          description: Deleted
        '423':
          $ref: '#/components/responses/Locked'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '412':
          $ref: '#/components/responses/VersionConflict'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
      operationId: deleteElement
      x-required-capability: mol_delete_translation_elements
  /elements/{id}/lock:
    post:
      summary: Acquire element lock
      security:
      - wpRestNonce: []
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Lock acquired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LockLeaseResponse'
        '423':
          $ref: '#/components/responses/Locked'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: acquireElementLock
      x-required-capability: mol_edit_translations
    put:
      summary: Renew element lock
      security:
      - wpRestNonce: []
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/LockToken'
      responses:
        '200':
          description: Lock renewed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LockLeaseResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/LockLost'
      operationId: renewElementLock
      x-required-capability: mol_edit_translations
      description: Renew succeeds only while X-MOL-Lock-Token identifies the current unexpired lease for this user.
        Missing/expired/replaced lease => 409 mol_lock_lost; missing element => 404.
    delete:
      summary: Release element lock
      security:
      - wpRestNonce: []
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/LockTokenOptional'
      responses:
        '204':
          description: Released
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/LockLost'
      operationId: releaseElementLock
      x-required-capability: lock_owner_with_token_or_mol_manage_content
      description: The lock owner must provide X-MOL-Lock-Token. A caller with mol_manage_content may omit the token
        to force-release a stale/blocking lock. For a normal owner release, an expired/replaced/invalid token returns
        409 mol_lock_lost. Releasing an existing element with no active lock is idempotent 204 for managers. No
        separate force-unlock endpoint exists.
  /presets:
    get:
      summary: List available presets
      security:
      - wpRestNonce: []
      responses:
        '200':
          description: Available presets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresetListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      operationId: listPresets
      x-required-capability: mol_use_editor
      parameters:
      - name: work_id
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      - name: type
        in: query
        required: false
        schema:
          type: string
          enum:
          - bubble
          - narration
          - free_text
          - sfx
    post:
      summary: Create preset
      security:
      - wpRestNonce: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresetResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/InvalidParams'
      operationId: createPreset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresetCreate'
      x-required-capability: scope_dependent
  /presets/{id}:
    patch:
      summary: Update preset
      security:
      - wpRestNonce: []
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresetResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/InvalidParams'
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: updatePreset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresetPatch'
      x-required-capability: scope_dependent
    delete:
      summary: Delete preset
      security:
      - wpRestNonce: []
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: deletePreset
      x-required-capability: scope_dependent
  /reports:
    post:
      summary: Create report
      security:
      - wpRestNonce: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/InvalidParams'
        '429':
          $ref: '#/components/responses/RateLimited'
      operationId: createReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportCreate'
      x-required-capability: mol_report_issue
    get:
      summary: List reports for moderators
      security:
      - wpRestNonce: []
      responses:
        '200':
          description: Moderation report list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      operationId: listReports
      x-required-capability: mol_moderate_reports
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - open
          - in_review
          - resolved
          - rejected
      - name: chapter_id
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
  /reports/{id}:
    patch:
      summary: Moderate report
      security:
      - wpRestNonce: []
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/InvalidParams'
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: updateReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportPatch'
      x-required-capability: mol_moderate_reports
  /profiles/{username}:
    get:
      summary: Public profile
      parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Public profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: getProfile
  /reading-progress:
    put:
      summary: Save reading progress
      security:
      - wpRestNonce: []
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadingProgressResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/InvalidParams'
      operationId: saveReadingProgress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReadingProgressUpdate'
      x-required-capability: authenticated_user
  /chapters/{id}/elements:
    get:
      summary: Get all translation elements for a chapter grouped by page
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: Chapter translation overlay bundle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChapterElementsResponse'
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: listChapterElements
      security:
      - wpRestNonce: []
      - {}
      x-resource-visibility: published_public_draft_editor_or_manager_else_404
      description: 'Visibility policy: published chapter resources are public. If the owning chapter is unpublished,
        the same route returns the resource only when the request carries a valid WordPress REST authenticated context
        and the caller has mol_use_editor or mol_manage_content; otherwise it returns 404 to avoid disclosing draft
        existence. Element collections expose each element version in the JSON body rather than one HTTP ETag per
        child. The editor constructs the required strong If-Match value for an element as the quoted decimal version,
        e.g. version 7 => If-Match: "7".'
  /chapters/{id}/review:
    patch:
      summary: Review chapter translation status
      security:
      - wpRestNonce: []
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChapterReviewPatch'
      responses:
        '200':
          description: Reviewed chapter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChapterResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/InvalidParams'
      operationId: reviewChapterTranslation
      x-required-capability: mol_review_translations
components:
  securitySchemes:
    wpRestNonce:
      type: apiKey
      in: header
      name: X-WP-Nonce
      description: WordPress REST nonce header. Authentication itself comes from the same-origin WordPress login
        cookie; X-WP-Nonce is CSRF protection and is not standalone authentication.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      description: Strong entity-tag/version required for conditional element update/delete. Missing precondition
        returns 428; stale value returns 412.
    LockToken:
      name: X-MOL-Lock-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 32
        maxLength: 128
    MOLIdempotencyKeyRequired:
      name: MOL-Idempotency-Key
      in: header
      required: true
      description: Application-defined retry key required for retry-sensitive MOL POST operations. This is a private
        application contract, not a published HTTP standard.
      schema:
        type: string
        minLength: 1
        maxLength: 100
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 24
    Lang:
      name: lang
      in: query
      schema:
        type: string
        default: ar
        maxLength: 255
    LockTokenOptional:
      name: X-MOL-Lock-Token
      in: header
      required: false
      schema:
        type: string
        minLength: 32
        maxLength: 128
      description: Required when the current user releases their own lock. A caller authorized by mol_manage_content
        may omit it to force-release the current lock.
  schemas:
    Geometry:
      type: object
      required:
      - x_unit
      - y_unit
      - w_unit
      - h_unit
      properties:
        x_unit:
          type: integer
          minimum: 0
          maximum: 1000000
        y_unit:
          type: integer
          minimum: 0
          maximum: 1000000
        w_unit:
          type: integer
          minimum: 1
          maximum: 1000000
        h_unit:
          type: integer
          minimum: 1
          maximum: 1000000
        rotation_mdeg:
          type: integer
          minimum: -360000
          maximum: 360000
        z_index:
          type: integer
          minimum: -1000
          maximum: 10000
    ElementCreate:
      allOf:
      - $ref: '#/components/schemas/Geometry'
      - type: object
        required:
        - page_id
        - target_lang
        - element_type
        - content
        properties:
          page_id:
            type: integer
            minimum: 1
          target_lang:
            type: string
            default: ar
            maxLength: 255
          element_type:
            type: string
            enum:
            - bubble
            - narration
            - free_text
            - sfx
          content:
            type: string
            maxLength: 10000
          style:
            $ref: '#/components/schemas/ElementStyle'
            description: Optional partial override merged onto the resolved preset/base style. The response always
              returns the resolved style.
          preset_id:
            type:
            - integer
            - 'null'
            minimum: 1
            description: Optional preset selected explicitly for this element. If omitted, the server resolves the
              default preset chain.
      - if:
          properties:
            element_type:
              const: bubble
          required:
          - element_type
        then:
          properties:
            style:
              $ref: '#/components/schemas/BubbleStyle'
      - if:
          properties:
            element_type:
              const: narration
          required:
          - element_type
        then:
          properties:
            style:
              $ref: '#/components/schemas/NarrationStyle'
      - if:
          properties:
            element_type:
              const: free_text
          required:
          - element_type
        then:
          properties:
            style:
              $ref: '#/components/schemas/FreeTextStyle'
      - if:
          properties:
            element_type:
              const: sfx
          required:
          - element_type
        then:
          properties:
            style:
              $ref: '#/components/schemas/SfxStyle'
      unevaluatedProperties: false
    ElementPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        element_type:
          type: string
          enum:
          - bubble
          - narration
          - free_text
          - sfx
          description: Immutable discriminator. Required when style is patched and MUST equal the persisted element
            type; it is never changed by PATCH.
        x_unit:
          type: integer
          minimum: 0
          maximum: 1000000
        y_unit:
          type: integer
          minimum: 0
          maximum: 1000000
        w_unit:
          type: integer
          minimum: 1
          maximum: 1000000
        h_unit:
          type: integer
          minimum: 1
          maximum: 1000000
        rotation_mdeg:
          type: integer
          minimum: -360000
          maximum: 360000
        z_index:
          type: integer
          minimum: -1000
          maximum: 10000
        content:
          type: string
          maxLength: 10000
        style:
          $ref: '#/components/schemas/ElementStyle'
      dependentRequired:
        style:
        - element_type
      anyOf:
      - required:
        - x_unit
      - required:
        - y_unit
      - required:
        - w_unit
      - required:
        - h_unit
      - required:
        - rotation_mdeg
      - required:
        - z_index
      - required:
        - content
      - required:
        - style
      allOf:
      - if:
          properties:
            element_type:
              const: bubble
          required:
          - element_type
        then:
          properties:
            style:
              $ref: '#/components/schemas/BubbleStyle'
      - if:
          properties:
            element_type:
              const: narration
          required:
          - element_type
        then:
          properties:
            style:
              $ref: '#/components/schemas/NarrationStyle'
      - if:
          properties:
            element_type:
              const: free_text
          required:
          - element_type
        then:
          properties:
            style:
              $ref: '#/components/schemas/FreeTextStyle'
      - if:
          properties:
            element_type:
              const: sfx
          required:
          - element_type
        then:
          properties:
            style:
              $ref: '#/components/schemas/SfxStyle'
      description: Partial mutable element update. Empty/no-op payloads are invalid. element_type is accepted only
        as an immutable discriminator for validating a style patch.
    ElementStyle:
      title: MOL Element Style
      type: object
      additionalProperties: false
      properties:
        fontId:
          type: string
          enum:
          - noto-sans-arabic
          - cairo
          - tajawal
          - noto-kufi-arabic
          - sfx-display-1
        fontSizeUnit:
          type: integer
          minimum: 1000
          maximum: 200000
        fontWeight:
          type: integer
          enum:
          - 400
          - 500
          - 600
          - 700
          - 800
          - 900
        lineHeight:
          type: number
          minimum: 1
          maximum: 2.5
        textAlign:
          type: string
          enum:
          - start
          - center
          - end
        color:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
        backgroundColor:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
        backgroundOpacity:
          type: number
          minimum: 0
          maximum: 1
        borderColor:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
        borderWidthUnit:
          type: integer
          minimum: 0
          maximum: 50000
        borderRadiusUnit:
          type: integer
          minimum: 0
          maximum: 500000
        paddingUnit:
          type: integer
          minimum: 0
          maximum: 100000
        shape:
          type: string
          enum:
          - ellipse
          - rounded_rect
          - rect
          - cloud
          - none
          - burst
          - impact
        strokeColor:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
        strokeWidthUnit:
          type: integer
          minimum: 0
          maximum: 50000
        shadow:
          type:
          - object
          - 'null'
          additionalProperties: false
          properties:
            xUnit:
              type: integer
              minimum: -50000
              maximum: 50000
            yUnit:
              type: integer
              minimum: -50000
              maximum: 50000
            blurUnit:
              type: integer
              minimum: 0
              maximum: 50000
            color:
              type: string
              pattern: ^#[0-9A-Fa-f]{6}$
            opacity:
              type: number
              minimum: 0
              maximum: 1
        tail:
          type:
          - object
          - 'null'
          additionalProperties: false
          properties:
            enabled:
              type: boolean
            angleMdeg:
              type: integer
              minimum: -360000
              maximum: 360000
            lengthUnit:
              type: integer
              minimum: 0
              maximum: 300000
            widthUnit:
              type: integer
              minimum: 0
              maximum: 200000
        burst:
          type:
          - object
          - 'null'
          additionalProperties: false
          properties:
            points:
              type: integer
              enum:
              - 8
              - 12
              - 16
              - 24
            depth:
              type: number
              minimum: 0
              maximum: 1
        scaleX:
          type: number
          minimum: 0.5
          maximum: 2
        scaleY:
          type: number
          minimum: 0.5
          maximum: 2
        autoFit:
          type: boolean
        minFontSizeUnit:
          type: integer
          minimum: 1000
          maximum: 100000
    ChapterCreate:
      type: object
      additionalProperties: false
      required:
