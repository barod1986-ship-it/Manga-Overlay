      type: object
      additionalProperties: false
      required:
      - upload_mime_types
      - derived_image_formats
      - most_read_available
      properties:
        upload_mime_types:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - image/jpeg
            - image/png
            - image/webp
            - image/avif
        derived_image_formats:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - jpeg
            - webp
            - avif
        most_read_available:
          type: boolean
    CapabilitiesResponse:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/RuntimeCapabilities'
        meta:
          type: object
          additionalProperties: false
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: mol_not_found
            message: Resource not found.
            data:
              status: 404
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: mol_forbidden
            message: You are not allowed to perform this action.
            data:
              status: 403
    UnsupportedMedia:
      description: Unsupported media
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: mol_unsupported_media
            message: Unsupported media type.
            data:
              status: 415
    VersionConflict:
      description: Stale If-Match version
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: mol_version_conflict
            message: The element version is stale.
            data:
              status: 412
    Locked:
      description: Element locked by another editor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: mol_element_locked
            message: The element is locked by another editor.
            data:
              status: 423
    PreconditionRequired:
      description: Required If-Match header was not supplied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: mol_precondition_required
            message: If-Match is required for this operation.
            data:
              status: 428
    IdempotencyMismatch:
      description: Idempotency key was reused with a different request payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: mol_idempotency_mismatch
            message: The idempotency key was already used with a different request payload.
            data:
              status: 409
    InvalidParams:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: mol_invalid_params
            message: Request validation failed.
            data:
              status: 400
    RateLimited:
      description: Rate limited
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: mol_rate_limited
            message: Too many requests.
            data:
              status: 429
      headers:
        Retry-After:
          description: Delay in seconds before a retry when available.
          schema:
            type: integer
            minimum: 0
    Unauthorized:
      description: Authentication/session required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: mol_not_authenticated
            message: Authentication is required.
            data:
              status: 401
    InvalidReorder:
      description: Invalid page permutation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: mol_invalid_reorder
            message: page_ids must be a complete permutation of the chapter pages.
            data:
              status: 400
    LibraryBadRequest:
      description: Invalid library parameters or a sort mode whose backend is unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidParams:
              value:
                code: mol_invalid_params
                message: Request validation failed.
                data:
                  status: 400
            sortUnavailable:
              value:
                code: mol_sort_unavailable
                message: The requested sort mode is not available on this installation.
                data:
                  status: 400
    PayloadTooLarge:
      description: Request payload is too large
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: mol_payload_too_large
            message: The uploaded payload exceeds the allowed size.
            data:
              status: 413
    LockLost:
      description: The supplied lease token no longer represents the active lock
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: mol_lock_lost
            message: The element lock expired, was released, or was replaced.
            data:
              status: 409
    SlugConflict:
      description: A unique chapter slug could not be reserved
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: mol_slug_conflict
            message: A unique chapter slug could not be generated. Retry with updated chapter metadata.
            data:
              status: 409
